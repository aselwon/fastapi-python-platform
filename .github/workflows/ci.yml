name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opsticket
          POSTGRES_PASSWORD: opsticket
          POSTGRES_DB: opsticket_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opsticket -d opsticket_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      DATABASE_URL: postgresql+psycopg://opsticket:opsticket@localhost:5432/opsticket_test
      TEST_DATABASE_URL: postgresql+psycopg://opsticket:opsticket@localhost:5432/opsticket_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest
      - run: uv run alembic downgrade base && uv run alembic upgrade head
