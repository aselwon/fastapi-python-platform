[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opsticket-api"
version = "0.1.0"
description = "Multi-tenant operations ticketing API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "pydantic-settings>=2.5,<3",
  "email-validator>=2,<3",
  "PyJWT>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
